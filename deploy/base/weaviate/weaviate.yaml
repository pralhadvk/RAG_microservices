# Weaviate vector database: single node, data on a PersistentVolumeClaim.
# StatefulSet (not Deployment) so the pod keeps its volume and identity across restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weaviate
  namespace: rag-system
  labels:
    app: weaviate
spec:
  serviceName: weaviate-headless
  replicas: 1
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
        - name: weaviate
          image: cr.weaviate.io/semitechnologies/weaviate:1.40.2
          args: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          env:
            - name: PERSISTENCE_DATA_PATH
              value: /var/lib/weaviate
            # Vectors are computed by retrieval-service, so no vectorizer modules.
            - name: DEFAULT_VECTORIZER_MODULE
              value: none
            - name: QUERY_DEFAULTS_LIMIT
              value: "25"
            # Reachable only inside the cluster (ClusterIP, no Ingress). Turn on
            # API-key auth before exposing it anywhere else.
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
            # Fixed node name keeps the Raft identity stable when the pod is recreated.
            - name: CLUSTER_HOSTNAME
              value: node1
            - name: DISABLE_TELEMETRY
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/weaviate
          readinessProbe:
            httpGet:
              path: /v1/.well-known/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/.well-known/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: weaviate
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: uses the cluster default ("standard" on kind, gp3/gp2 on EKS).
        resources:
          requests:
            storage: 1Gi
---
# Headless Service required by the StatefulSet for stable pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: weaviate-headless
  namespace: rag-system
  labels:
    app: weaviate
spec:
  clusterIP: None
  selector:
    app: weaviate
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# What retrieval-service connects to: REST on 8080, gRPC on 50051.
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: rag-system
  labels:
    app: weaviate
spec:
  type: ClusterIP
  selector:
    app: weaviate
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
