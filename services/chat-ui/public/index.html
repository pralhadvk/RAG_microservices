<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Lab — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">RAG Lab</p>
        <p class="brand-sub">kind · microservices · traced</p>
      </div>
    </div>
    <div class="status" id="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">checking</span>
    </div>
  </header>

  <main class="layout">
    <aside class="rail">
      <h2 class="rail-title">Controls</h2>

      <label class="field">
        <span>Collection</span>
        <input id="collection" type="text" value="docs-v1" autocomplete="off" />
      </label>

      <label class="field">
        <span>Model</span>
        <select id="model">
          <option value="openai/gpt-4o-mini" selected>openai/gpt-4o-mini</option>
          <option value="openai/gpt-4o">openai/gpt-4o</option>
          <option value="google/gemini-2.0-flash-001">google/gemini-2.0-flash-001</option>
          <option value="anthropic/claude-3.5-haiku">anthropic/claude-3.5-haiku</option>
        </select>
      </label>

      <label class="field">
        <span>Top K</span>
        <input id="topK" type="number" min="1" max="20" value="5" />
      </label>

      <label class="field">
        <span>Temperature</span>
        <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2" />
      </label>

      <div class="rail-actions">
        <button type="button" class="btn ghost" id="clearBtn">Clear chat</button>
      </div>

      <div class="hint">
        <p>Answers are grounded in your Qdrant collection. Open Jaeger with the request id shown under each reply.</p>
      </div>
    </aside>

    <section class="chat-panel">
      <div class="chat-scroll" id="messages" aria-live="polite"></div>

      <form class="composer" id="chatForm">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Ask about your documents…"
          required
        ></textarea>
        <button type="submit" class="btn primary" id="sendBtn">
          Send
        </button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
